<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
  <meta name="theme-color" content="#0b1a2e">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="{{ current_url | default(value=config.base_url) | safe }}">

  <link rel="icon" href="{{ get_url(path='favicon.ico') }}" sizes="48x48">
  <link rel="icon" href="{{ get_url(path='images/icon.svg') }}" type="image/svg+xml">
  <link rel="icon" href="{{ get_url(path='favicon-32.png') }}" type="image/png" sizes="32x32">
  <link rel="icon" href="{{ get_url(path='favicon-16.png') }}" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="{{ get_url(path='apple-touch-icon.png') }}">

  <!-- Social previews (Open Graph, Twitter/X cards). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.title }}">
  <meta property="og:title" content="{% block og_title %}{{ config.title }}{% endblock %}">
  <meta property="og:description" content="{% block og_description %}{{ config.description }}{% endblock %}">
  <meta property="og:url" content="{{ current_url | default(value=config.base_url) | safe }}">
  <meta property="og:image" content="{{ get_url(path='images/og.jpg') }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="vardøger — the digital twin platform for intelligent mechatronics">
  <meta property="og:locale" content="{% if lang == 'no' %}nb_NO{% else %}en_GB{% endif %}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ get_url(path='images/og.jpg') }}">

  <link rel="stylesheet" href="{{ get_url(path='css/style.css') }}">
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
