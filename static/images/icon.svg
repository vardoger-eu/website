      <rect id="payload-separation-outline" x="-55" y="124" width="110" height="34" rx="3" fill="#0D2037" stroke="#0D2037" stroke-width="20"/>
      <rect id="landed-payload" x="-55" y="124" width="110" height="34" rx="3" fill="#12354D" stroke="#6DE1FA" stroke-width="8"/>
    </g>
  </defs>

  <g id="background">
    <rect x="26" y="26" width="972" height="972" rx="210" fill="url(#navy-background)"/>
    <rect x="26" y="26" width="972" height="972" rx="210" fill="url(#navy-atmosphere)"/>
  </g>

