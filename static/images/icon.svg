  <g id="digital-twin">
    <use xlink:href="#digital-arm-geometry" opacity="0.46" filter="url(#soft-cyan-glow)"/>
    <use xlink:href="#digital-arm-geometry"/>
    <path id="floor-glow" d="M 562 750 H 738" fill="none" stroke="url(#floor-light)" stroke-width="12" opacity="0.38" filter="url(#soft-cyan-glow)"/>
