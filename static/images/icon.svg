      <path d="M 346 604 L 500 500 L 650 560" fill="none" stroke="#102A45" stroke-width="26" stroke-linecap="round"/>
      <circle cx="500" cy="500" r="25" fill="#102A45"/>
      <circle cx="650" cy="560" r="22" fill="#102A45"/>
    </g>
    <g id="digital-coupling-geometry" transform="translate(650 580)">
      <rect x="-5" y="76" width="10" height="48" fill="url(#twin-post)"/>
      <circle cx="0" cy="62" r="17" fill="url(#twin-ball)"/>
      <circle cx="-5" cy="56" r="3" fill="#EAFDFF" opacity="0.85"/>
      <rect x="-9" y="0" width="18" height="22" rx="4" fill="#102A45" stroke="#6DE1FA" stroke-width="6"/>
