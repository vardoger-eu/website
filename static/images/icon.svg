      <stop offset="0.22" stop-color="#B6D2E2"/>
      <stop offset="0.55" stop-color="#7298B1"/>
      <stop offset="1" stop-color="#344F6C"/>
    </radialGradient>
    <linearGradient id="steel-post">
      <stop offset="0" stop-color="#526F8A"/>
      <stop offset="0.38" stop-color="#D5EAF3"/>
      <stop offset="0.68" stop-color="#A7C4D5"/>
      <stop offset="1" stop-color="#527790"/>
    </linearGradient>
    <radialGradient id="twin-ball" cx="0.31" cy="0.26" r="0.77">
      <stop offset="0" stop-color="#E9FCFF"/>
      <stop offset="0.25" stop-color="#A7EDFA"/>
      <stop offset="0.62" stop-color="#4FC2DE"/>
      <stop offset="1" stop-color="#237C9E"/>
    </radialGradient>
    <linearGradient id="twin-post">
      <stop offset="0" stop-color="#329FBE"/>
      <stop offset="0.4" stop-color="#C4F8FF"/>
      <stop offset="1" stop-color="#4CC7E2"/>
    </linearGradient>
    <linearGradient id="floor-light" gradientUnits="userSpaceOnUse" x1="560" y1="750" x2="740" y2="750">
      <stop offset="0" stop-color="#60DCFA" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#60DCFA" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#60DCFA" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#60DCFA" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft-cyan-glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <g id="socket-housing" fill="none" stroke-linecap="round" stroke-linejoin="round">
