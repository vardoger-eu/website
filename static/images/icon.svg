 408.938 76.016 L 444.235 69.155 L 470.960 134.223 A 380 380 0 0 1 506.694 132.037 Z M 862 512 A 350 350 0 1 0 162 512 A 350 350 0 1 0 862 512 Z" fill="url(#gear-orange)" fill-rule="evenodd"/>
