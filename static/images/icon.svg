    <path d="M 346 604 L 390 376" fill="none" stroke="url(#arm-orange)" stroke-width="76" stroke-linecap="round"/>
    <path d="M 390 376 L 610 269" fill="none" stroke="url(#arm-orange)" stroke-width="64" stroke-linecap="round"/>
    <rect x="604" y="274" width="20" height="49" rx="5" fill="#B9C4CF"/>
