<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1024" height="1024" viewBox="0 0 1024 1024"
     role="img" aria-labelledby="icon-title icon-description">
  <title id="icon-title">Vardøger app icon</title>
  <desc id="icon-description">An orange gear frames a real orange industrial arm carrying a suspended payload and a softly glowing cyan digital twin with its payload on the floor. Both arms use the AHS claw: a lifting eye and hub with five curved ribs that close around a ball on a short rod fixed to the payload.</desc>
  <defs>
    <linearGradient id="navy-background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B3556"/>
      <stop offset="0.55" stop-color="#102541"/>
      <stop offset="1" stop-color="#08172D"/>
    </linearGradient>
    <radialGradient id="navy-atmosphere" cx="0.51" cy="0.43" r="0.65">
      <stop offset="0" stop-color="#275575" stop-opacity="0.23"/>
      <stop offset="0.72" stop-color="#12354E" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#07182C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gear-orange" x1="0.14" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ED874A"/>
      <stop offset="0.49" stop-color="#E8743B"/>
      <stop offset="1" stop-color="#D9632F"/>
    </linearGradient>
    <linearGradient id="arm-orange" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F4F7FA"/>
      <stop offset="1" stop-color="#C9D3DD"/>
    </linearGradient>
    <radialGradient id="steel-ball" cx="0.31" cy="0.26" r="0.77">
